<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Match Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fecfef, #fbc2eb);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
        position: relative;
    }

    /* TITLE + SLOGAN */
    .top-title {
        position: absolute;
        top: 40px;
        width: 100%;
        text-align: center;
        color: #2a2a2a;
        z-index: 50;
        animation: fadeDown 1.2s ease;
    }
    .top-title h1 {
        font-size: 46px;
        font-weight: 700;
        margin: 0;
    }
    .top-title p {
        font-size: 24px;
        font-weight: 600;
        margin-top: 10px;
        opacity: 0.95;
    }

    @keyframes fadeDown {
        from { transform: translateY(-25px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* 100+ FLOATING EMOJIS */
    .emoji {
        position: absolute;
        user-select: none;
        opacity: 0.25;
        animation: drift 12s infinite ease-in-out alternate;
    }

    @keyframes drift {
        0%   { transform: translate(0px, 0px); }
        25%  { transform: translate(40px, -50px); }
        50%  { transform: translate(-30px, 30px); }
        75%  { transform: translate(20px, 20px); }
        100% { transform: translate(-40px, -30px); }
    }

    /* UPLOAD BOX LOWERED MORE */
    .upload-container {
        background: rgba(255,255,255,0.92);
        width: 580px;
        padding: 35px 40px;
        border-radius: 28px;
        box-shadow: 0 25px 45px rgba(0,0,0,0.16);
        position: relative;
        top: 220px; /* MOVED FURTHER DOWN */
        animation: popUp 0.9s ease;
        z-index: 99;
    }

    @keyframes popUp {
        from { transform: translateY(40px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
    }

    .upload-title {
        font-size: 24px;
        font-weight: 700;
        color: #333;
        margin-bottom: 5px;
    }

    .upload-sub {
        font-size: 13px;
        opacity: 0.75;
        margin-bottom: 20px;
    }

    .upload-box {
        border: 2px dashed #c2b8ff;
        padding: 22px;
        border-radius: 18px;
        background: #f9f7ff;
        cursor: pointer;
        margin-bottom: 20px;
        transition: .3s;
    }
    .upload-box:hover {
        background: #f2eaff;
        border-color: #8a63f0;
        transform: translateY(-4px);
        box-shadow: 0 8px 18px rgba(90,40,180,0.25);
    }

    .upload-label {
        font-size: 15px;
        font-weight: 600;
        color: #4b2cb3;
    }

    .file-name {
        font-size: 13px;
        margin-top: 6px;
        color: #7b3fe0;
        display: none;
    }

    input[type="file"] { display: none; }

    .btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg,#6a11cb,#8f33e6);
        color: white;
        border: none;
        border-radius: 16px;
        font-size: 17px;
        cursor: pointer;
        box-shadow: 0 12px 25px rgba(120,40,200,0.4);
        transition: .2s;
    }
    .btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 32px rgba(120,40,200,0.55);
    }
    
    /* Loading overlay */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    
    .loading-content {
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        max-width: 400px;
        width: 80%;
    }
    
    .loading-spinner {
        border: 5px solid #f3f3f3;
        border-top: 5px solid #6a11cb;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .loading-text {
        font-size: 18px;
        color: #333;
        margin-bottom: 10px;
    }
    
    .loading-subtext {
        font-size: 14px;
        color: #666;
    }
    
    /* Spark UI Button */
    .spark-ui-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        background: linear-gradient(135deg, #6a11cb, #8f33e6);
        color: white;
        border: none;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(120,40,200,0.4);
        transition: all 0.3s ease;
        z-index: 1000;
    }

    .spark-ui-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(120,40,200,0.55);
    }
</style>
</head>

<body>

<div class="top-title">
    <h1>Resume Match Engine</h1>
    <p>Find your perfect job match in seconds.</p>
</div>

<!-- 120 FLOATING EMOJIS -->
<script>
    const emojisList = ["","","","","","","","","","","","","","","",""];

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    for (let i = 0; i < 120; i++) {
        const em = document.createElement("div");
        em.classList.add("emoji");
        em.innerText = emojisList[Math.floor(Math.random() * emojisList.length)];
        em.style.left = random(2, 98) + "%";
        em.style.top = random(2, 95) + "%";
        em.style.fontSize = random(28, 60) + "px";
        em.style.animationDuration = random(6, 16) + "s";
        em.style.animationDelay = random(0, 5) + "s";
        em.style.opacity = random(0.15, 0.35);
        document.body.appendChild(em);
    }
</script>

<!-- Upload Card -->
<div class="upload-container">










    
    <div class="upload-title">Upload Documents</div>
    <div class="upload-sub">Upload your Resume and Job Description for AI matching</div>

    <div class="upload-box" onclick="document.getElementById('resume').click()">
        <div class="upload-label">Upload Resume</div>
        <div id="resumeName" class="file-name"></div>
    </div>

    <input type="file" id="resume" accept=".pdf,.docx">

    <div class="upload-box" onclick="document.getElementById('jd').click()">
        <div class="upload-label">Upload Job Description</div>
        <div id="jdName" class="file-name"></div>
    </div>

    <input type="file" id="jd" accept=".pdf,.docx">

    <button id="analyzeBtn" class="btn" onclick="goNext()">Analyze</button>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-text">Analyzing Documents</div>
        <div class="loading-subtext">This may take a few moments...</div>
    </div>
</div>

<script>
    /* File name display */
    let resume = document.getElementById("resume");
    let jd = document.getElementById("jd");

    resume.addEventListener("change", () => {
        let box = document.getElementById("resumeName");
        box.textContent = resume.files[0].name;
        box.style.display = "block";
    });

    jd.addEventListener("change", () => {
        let box = document.getElementById("jdName");
        box.textContent = jd.files[0].name;
        box.style.display = "block";
    });

    function goNext() {
        if (!resume.files[0] || !jd.files[0]) {
            alert("Please upload both files!");
            return;
        }
        
        // Show loading overlay
        document.getElementById('loadingOverlay').style.display = 'flex';
        document.getElementById('analyzeBtn').disabled = true;
        
        // Create FormData and send to backend
        const formData = new FormData();
        formData.append("resume", resume.files[0]);
        formData.append("job", jd.files[0]);
        
        // Send files to backend for processing using fetch
        fetch("http://127.0.0.1:5000/analyze", {
            method: "POST",
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP error! status: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            localStorage.setItem("matchData", JSON.stringify(data));
            window.location.href = "/result.html";
        })
        .catch(error => {
            console.error("Error:", error);
            // Store error info and go to results page
            let errorMessage = "Unknown error occurred";
            if (error.message) {
                errorMessage = error.message;
            } else if (error.toString) {
                errorMessage = error.toString();
            }
            localStorage.setItem("matchData", JSON.stringify({
                score: 0,
                resume_skills: [],
                job_skills: [],
                matching_skills: [],
                missing_skills: [],
                summary: "Error processing files: " + errorMessage
            }));
            window.location.href = "/result.html";
        });
    }
    
    // Spark UI Integration
    // Function to open Spark UI
    function openSparkUI() {
        // Show a message to the user
        const btn = document.querySelector('.spark-ui-btn');
        const originalText = btn.textContent;
        btn.textContent = 'Opening Spark UI...';
        btn.disabled = true;
        
        // Fetch the actual Spark UI URL from backend
        fetch('/spark-status')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ready' && data.spark_ui_url) {
                    // Open the actual Spark UI URL in a new tab
                    window.open(data.spark_ui_url, '_blank');
                } else {
                    // Fallback to default if not available
                    window.open('http://localhost:4040', '_blank');
                }
                // Reset button after a short delay
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 2000);
            })
            .catch(error => {
                console.error('Error fetching Spark UI URL:', error);
                // Fallback to default URL
                window.open('http://localhost:4040', '_blank');
                // Reset button after a short delay
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 2000);
            });
    }
    
    // Add event listener to Spark UI button when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        const sparkBtn = document.querySelector('.spark-ui-btn');
        if (sparkBtn) {
            sparkBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openSparkUI();
            });
        }
    });
</script>

<!-- Spark UI Button -->
<button class="spark-ui-btn">Open Spark UI</button>

</body>
</html>
